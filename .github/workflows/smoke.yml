# KTP Tier 1 — Build-time smoke for KTPScoreTracker
# Implementation in KTPInfrastructure/.github/workflows/smoke-callable.yml.
#
# Auto-triggers were tried 2026-05-28 and failed, so the workflow was set
# manual-only. Re-enabled 2026-08-09 after checking WHICH step failed rather
# than disabling the whole gate: run 26609235121 failed at step 30, "Assert
# plugin running", and at nothing else — compile, container boot and artifact
# verification all passed.
#
# The load-assert cannot pass and is not expected to: KTPScoreTracker is
# per-instance opt-in and deliberately commented out of the canonical
# plugins.ini (KTPInfrastructure/config/online/plugins.ini), so the container
# never loads it. `assert_plugin` is optional in smoke-callable.yml and its
# step is `if: inputs.assert_plugin != ''`, so omitting it skips exactly that
# step and keeps everything before it.
#
# What this gates: the .sma compiles under the KTP amxxpc, and the .amxx lands
# at the expected container path. That is the whole reason to run CI here —
# without it a broken source ships to 24 instances with only a local compile
# behind it, which is what happened to 1.1.5.
#
# Restore `assert_plugin: KTPScoreTracker` if the plugin is ever added to the
# canonical plugins.ini — the load-assert is the stronger check and should
# come back the moment it can pass.

name: Tier 1 Smoke

on:
  # No filter of any kind on `pull_request` -- the job below is a REQUIRED
  # status check. A filtered workflow never fires on the PRs it excludes, the
  # check never reports, and the branch cannot be merged without an --admin
  # override. `paths-ignore` was dropped for that reason; `branches: [main]`
  # is the same trap for a PR opened against any other base and outlived it.
  # The other eight smoke callers all use a bare `pull_request: {}`.
  push:
    branches: [main]
  pull_request: {}
  workflow_dispatch:

jobs:
  smoke:
    uses: afraznein/KTPInfrastructure/.github/workflows/smoke-callable.yml@main
    with:
      under_test_label: KTPScoreTracker
      under_test_kind: amx_plugin
      amxx_source: KTPScoreTracker.sma
      artifact_container_path: /opt/hlds/dod/addons/ktpamx/plugins/KTPScoreTracker.amxx
    secrets:
      ktp_checkout_token: ${{ secrets.KTP_CHECKOUT_TOKEN }}
