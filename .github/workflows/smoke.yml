# KTP Tier 1 — Build-time smoke for KTPScoreTracker
# Implementation in KTPInfrastructure/.github/workflows/smoke-callable.yml.
#
# Manual-only until KTPScoreTracker is declared production-ready and added
# to the canonical plugins.ini. Auto-triggers were tried 2026-05-28 and
# failed because the container's plugins.ini intentionally omits this
# plugin (operator decision per memory `scoretracker_preproduction.md`),
# so the load-assert always fails. Re-enable push/PR triggers when the
# plugin is in plugins.ini.

name: Tier 1 Smoke

on:
  workflow_dispatch:

jobs:
  smoke:
    uses: afraznein/KTPInfrastructure/.github/workflows/smoke-callable.yml@main
    with:
      under_test_label: KTPScoreTracker
      under_test_kind: amx_plugin
      amxx_source: KTPScoreTracker.sma
      artifact_container_path: /opt/hlds/dod/addons/ktpamx/plugins/KTPScoreTracker.amxx
      assert_plugin: KTPScoreTracker
    secrets:
      ktp_checkout_token: ${{ secrets.KTP_CHECKOUT_TOKEN }}
